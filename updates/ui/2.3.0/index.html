<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: media: https:; media-src media:; font-src 'self'">
<title>استوديو المحتوى</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><div class="brand-mark" id="brandMark"></div><div><b>استوديو المحتوى</b><span>منصتك لإدارة كل حساباتك</span></div></div>
    <button class="create" data-act="createMenu" id="createBtn"></button>
    <nav id="nav" aria-label="الأقسام"></nav>
    <div class="rail-foot" id="railfoot"></div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <div class="search" data-act="palette" role="button" tabindex="0" id="searchBtn"></div>
      <div class="today" id="today"></div>
    </header>
    <main id="main"><div class="wrap" id="view"></div></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="live-root"></div>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
<script src="clips.js"></script>
<script src="studies.js"></script>
<script src="videos.js"></script>
<script src="api.js"></script>
</body>
</html>
